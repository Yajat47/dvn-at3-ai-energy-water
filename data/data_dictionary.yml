      year: {type: integer, unit: 'year', description: "Year the number refers to"}
      value: {type: number, unit: 'see unit column', description: "The number as printed in the report"}
      unit: {type: string, unit: 'none', description: "Unit of value (billion_gallons or %)"}
      kind: {type: string, unit: 'none', description: "actual: reported by the company"}
      source_id: {type: string, unit: 'none', description: "Source id in this dictionary"}
      quote: {type: string, unit: 'none', description: "Words from the report, word for word"}
    transform: Typed in by hand from the report PDF; the quote column holds the report's own words for each number.
    owner: Akil

