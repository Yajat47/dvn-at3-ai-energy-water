# Data dictionary for every dataset in data/. One source of truth:
#   - the app reads sources and the "last refreshed" date from here
#   - scripts/build_all.py renders data/DATA_DICTIONARY.md from here
#   - scripts/check_package.py checks every file in data/ against it
#
# Add your sources and datasets below the existing ones. Every column needs a type, a unit
# ("none" if it has no unit) and a description. Samples say how they were obtained; processed
# files name the script and the steps that produce them.

sources:
  - id: IEA-2026-KQ
    title: Key Questions on Energy and AI (executive summary)
    publisher: International Energy Agency
    url: https://www.iea.org/reports/key-questions-on-energy-and-ai/executive-summary
    licence: IEA terms of use (figures quoted with attribution)
    retrieved: '2026-10-20'
    cadence: One-off report (2026)
    owner: Yajat
  - id: OWID-DC-SHARE
    title: Share of total electricity demand used by data centers
    publisher: Our World in Data, based on IEA (2025, 2026) and Ember (2026)
    url: https://ourworldindata.org/grapher/data-centers-share-electricity-demand
    licence: CC BY 4.0 (Our World in Data processing); underlying IEA data under IEA terms
    retrieved: '2026-10-20'
    cadence: Updated when the IEA publishes new estimates
    owner: Yajat
  - id: OWID-EMBER-DEMAND
    title: Electricity demand
    publisher: Our World in Data, based on Ember (2026)
    url: https://ourworldindata.org/grapher/electricity-demand
    licence: CC BY 4.0
    retrieved: '2026-10-20'
    cadence: Annual (last updated 2026-06-30, next 2027-06-30)
    owner: Yajat
  - id: GOOGLE-2026-ENV
    title: Environmental Report 2026
    publisher: Google
    url: https://sustainability.google/files/google-2026-environmental-report.pdf
    licence: Company report (figures quoted with attribution)
    retrieved: '2026-10-26'
    cadence: Annual
    owner: Akil
  - id: EPOCH-MODELS
    title: Notable AI Models
    publisher: Epoch AI
    url: https://epoch.ai/data/notable-ai-models
    licence: CC BY 4.0
    retrieved: '2026-10-21'
    cadence: Updated continuously as models are published
    owner: Niki
  - id: EPOCH-HARDWARE
    title: Machine Learning Hardware
    publisher: Epoch AI
    url: https://epoch.ai/data/machine-learning-hardware
    licence: CC BY 4.0
    retrieved: '2026-10-21'
    cadence: Updated as new chips are released
    owner: Niki

datasets:
  # ---------------------------------------------------------------- source samples
  - id: owid_dc_share
    role: sample
    path: data/samples/owid_data_centers_share_electricity_demand.csv
    metadata_file: data/samples/owid_data_centers_share_electricity_demand.metadata.json
    format: csv
    source_ids: [OWID-DC-SHARE]
    description: IEA data-centre electricity use as a share of each region's electricity demand.
    primary_key: [Entity, Year]
    time_column: Year
    time_coverage: 2020 and 2023-2025 (the IEA publishes no 2021-2022 estimates)
    latest_observation: 2025
    columns:
      Entity: {type: string, unit: 'none', description: "Country or IEA region name"}
      Code: {type: string, unit: 'none', description: "ISO 3166-1 alpha-3 code; empty for regions, OWID_WRL for World"}
      Year: {type: integer, unit: 'year', description: "Calendar year"}
      Share of total electricity demand coming from data centers: {type: number, unit: '%', description: "Data-centre electricity use divided by total electricity demand, x 100"}
    transform: Downloaded unchanged from the OWID grapher CSV export by scripts/fetch_sources.py.
    owner: Yajat

  - id: owid_ember_demand
    role: sample
    path: data/samples/owid_ember_electricity_demand.csv
    metadata_file: data/samples/owid_ember_electricity_demand.metadata.json
    format: csv
    source_ids: [OWID-EMBER-DEMAND]
    description: Total electricity demand (generation adjusted for imports and exports) by country and region.
    primary_key: [Entity, Year]
    time_column: Year
    time_coverage: 1990-2025 (varies by entity)
    latest_observation: 2025
    columns:
      Entity: {type: string, unit: 'none', description: "Country or region name"}
      Code: {type: string, unit: 'none', description: "ISO 3166-1 alpha-3 code; empty for regions"}
      Year: {type: integer, unit: 'year', description: "Calendar year"}
      Electricity demand: {type: number, unit: 'TWh', description: "Total electricity demand in terawatt-hours"}
    transform: Downloaded unchanged from the OWID grapher CSV export by scripts/fetch_sources.py.
    owner: Yajat

  - id: iea_2026_key_numbers
    role: sample
    path: data/samples/manual/iea_2026_key_questions.csv
    format: csv
    source_ids: [IEA-2026-KQ]
    description: Headline numbers copied from the IEA report text, each with the sentence it came from.
    primary_key: [metric, year]
    time_column: year
    time_coverage: 2025 (actual) and 2030 (projection)
    latest_observation: 2025
    observation_filter: kind == 'actual'
    columns:
      metric: {type: string, unit: 'none', description: "What the number measures"}
      year: {type: integer, unit: 'year', description: "Year the number refers to"}
      value: {type: number, unit: 'see unit column', description: "The number as printed in the report"}
      unit: {type: string, unit: 'none', description: "Unit of value (TWh or %)"}
      kind: {type: string, unit: 'none', description: "actual or projection"}
      source_id: {type: string, unit: 'none', description: "Source id in this dictionary"}
      quote: {type: string, unit: 'none', description: "The report sentence, word for word"}
    transform: Typed in by hand from the report web page; the quote column holds each sentence word for word.
    owner: Yajat

  - id: google_2026_water_numbers
    role: sample
    path: data/samples/manual/google_2026_water.csv
    format: csv
    source_ids: [GOOGLE-2026-ENV]
    description: Water figures copied from the Google 2026 Environmental Report (water stewardship section), each with the phrase it came from.
    primary_key: [metric, year]
