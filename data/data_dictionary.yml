  # ---------------------------------------------------------------- processed files the app reads
  - id: global_dc_electricity
    role: processed
    path: data/processed/global_dc_electricity.csv
    format: csv
    source_ids: [OWID-DC-SHARE, OWID-EMBER-DEMAND, IEA-2026-KQ]
    description: Data-centre electricity in TWh and as a share of demand for World, United States, China and Rest of world, plus the IEA 2030 projection.
    primary_key: [entity, year]
    time_column: year
    time_coverage: 2020 and 2023-2025 (actual); 2030 (World projection only)
    latest_observation: 2025
    observation_filter: kind == 'actual'
    columns:
      entity: {type: string, unit: 'none', description: "World, United States, China or Rest of world"}
      year: {type: integer, unit: 'year', description: "Calendar year"}
      kind: {type: string, unit: 'none', description: "actual (IEA estimate) or projection (IEA 2026 base case)"}
      dc_share_pct: {type: number, unit: '%', description: "Data-centre share of electricity demand"}
      demand_twh: {type: number, unit: 'TWh', description: "Total electricity demand; empty for the projection row"}
      dc_twh: {type: number, unit: 'TWh', description: "Data-centre electricity use"}
      method: {type: string, unit: 'none', description: "How the row was produced"}
    transform:
      script: scripts/build_global.py
      inputs: [owid_dc_share, owid_ember_demand, iea_2026_key_numbers]
      steps:
        - Keep World, United States and China rows from both OWID files and inner-join on Entity and Year.
        - dc_twh = share (%) / 100 x Electricity demand (TWh).
        - Rest of world = World minus United States minus China (TWh); its share = dc_twh / demand_twh x 100.
        - Add the World 2030 projection (950 TWh, 3%) from the IEA manual file.
        - Stop if World 2025 differs from the IEA's 485 TWh by 2 TWh or more, or 2024-25 growth from 17% by 1.5 points.
    owner: Yajat

  - id: global_growth_index
    role: processed
    path: data/processed/global_growth_index.csv
    format: csv
    source_ids: [OWID-DC-SHARE, OWID-EMBER-DEMAND]
    description: World data-centre electricity and world electricity demand, each indexed to 2020 = 100.
    primary_key: [year, series]
    time_column: year
    time_coverage: 2020 and 2023-2025
    latest_observation: 2025
    columns:
      year: {type: integer, unit: 'year', description: "Calendar year"}
      series: {type: string, unit: 'none', description: "Data-centre electricity or All electricity demand"}
      twh: {type: number, unit: 'TWh', description: "Value of the series in that year"}
      index_2020: {type: number, unit: 'index (2020 = 100)', description: "twh / twh in 2020 x 100"}
    transform:
      script: scripts/build_global.py
      inputs: [owid_dc_share, owid_ember_demand]
      steps:
        - Take the World rows of global_dc_electricity (actual only).
        - index_2020 = value / value in 2020 x 100, separately for each series.
    owner: Yajat

  - id: global_comparisons
    role: processed
    path: data/processed/global_comparisons.csv
    format: csv
    source_ids: [OWID-DC-SHARE, OWID-EMBER-DEMAND]
    description: World data-centre electricity in 2025 next to whole countries' electricity demand.
    primary_key: [entity, year]
    time_column: year
    time_coverage: 2025
    latest_observation: 2025
    columns:
      entity: {type: string, unit: 'none', description: "Comparison country"}
      year: {type: integer, unit: 'year', description: "Calendar year"}
      demand_twh: {type: number, unit: 'TWh', description: "The country's total electricity demand"}
      world_dc_twh: {type: number, unit: 'TWh', description: "World data-centre electricity use"}
      ratio_dc_to_country: {type: number, unit: 'ratio', description: "world_dc_twh / demand_twh"}
    transform:
      script: scripts/build_global.py
      inputs: [owid_dc_share, owid_ember_demand]
      steps:
        - Take Australia, United Kingdom, France and Germany 2025 demand from the Ember file.
        - ratio_dc_to_country = World 2025 data-centre TWh / country demand TWh.
    owner: Yajat

  - id: water_google
    role: processed
    path: data/processed/water_google.csv
    format: csv
    source_ids: [GOOGLE-2026-ENV]
    description: Google's reported 2025 water figures with plain-English labels, read by the Water page.
    primary_key: [metric, year]
    time_column: year
    time_coverage: 2025
    latest_observation: 2025
    columns:
      metric: {type: string, unit: 'none', description: "Machine name of the measure"}
      label: {type: string, unit: 'none', description: "Plain-English name of the measure"}
      year: {type: integer, unit: 'year', description: "Year the number refers to"}
      value: {type: number, unit: 'see unit column', description: "The reported number, unchanged"}
      unit: {type: string, unit: 'none', description: "Unit of value (billion_gallons or %)"}
    transform:
      script: scripts/build_water.py
      inputs: [google_2026_water_numbers]
      steps:
        - Read the five reported numbers from the manual file.
        - Add a plain-English label to each. No value is changed.
        - The page computes The Dalles share = The Dalles gallons / total gallons x 100.
    owner: Akil

  - id: compute_vs_efficiency
    role: processed
    path: data/processed/compute_vs_efficiency.csv
    format: csv
    source_ids: [EPOCH-MODELS, EPOCH-HARDWARE]
    description: Record-to-date training compute of the largest AI model and FP32 efficiency of the best chip, by year, each indexed to 2012 = 1.
    primary_key: [series, year]
    time_column: year
    time_coverage: 2012-2025
    latest_observation: 2025
    columns:
      year: {type: integer, unit: year, description: Calendar year}
      series: {type: string, unit: none, description: 'Training compute of the largest model, or Efficiency of the best chip (FP32)'}
      value: {type: number, unit: see unit column, description: Record value released up to and including this year}
      unit: {type: string, unit: none, description: Unit of value (FLOP or FLOP/s per W)}
      record_holder: {type: string, unit: none, description: Model or chip that holds the record}
      record_organization: {type: string, unit: none, description: Developer or manufacturer of the record holder}
      record_year: {type: integer, unit: year, description: Year the record holder was released}
      index_2012: {type: number, unit: index (2012 = 1), description: value divided by the series' 2012 value}
    transform:
      script: scripts/build_compute.py
      inputs: [epoch_notable_ai_models, epoch_ml_hardware]
      steps: ['Models: keep rows with a publication date and a positive Training compute (FLOP).', 'Chips: keep rows with a release date, FP32 performance and TDP; efficiency = FP32 FLOP/s / TDP W.', 'For
          each year keep the best value released up to and including that year, so neither series falls.', Index each series to its 2012 value = 1., Stop if a record falls or either series fails to grow.]
    owner: Niki

  - id: compute_growth_summary
    role: processed
    path: data/processed/compute_growth_summary.csv
    format: csv
    source_ids: [EPOCH-MODELS, EPOCH-HARDWARE]
    description: Total multiple, average yearly growth and doubling time of each series in compute_vs_efficiency, 2012 to 2025.
    primary_key: [series]
    time_column: end_year
    time_coverage: 2012-2025
    latest_observation: 2025
    columns:
      series: {type: string, unit: none, description: 'Series name, as in compute_vs_efficiency'}
      start_year: {type: integer, unit: year, description: First year of the comparison}
      end_year: {type: integer, unit: year, description: Last year of the comparison}
      start_value: {type: number, unit: FLOP or FLOP/s per W, description: Record value in start_year}
      end_value: {type: number, unit: FLOP or FLOP/s per W, description: Record value in end_year}
      total_multiple: {type: number, unit: times, description: end_value / start_value}
      growth_per_year: {type: number, unit: times per year, description: total_multiple ^ (1 / years)}
      doubling_time_months: {type: number, unit: months, description: 12 x ln 2 / ln(growth_per_year)}
    transform:
      script: scripts/build_compute.py
      inputs: [compute_vs_efficiency]
      steps: [growth_per_year = (end_value / start_value) ^ (1 / (end_year - start_year))., doubling_time_months = 12 x ln 2 / ln(growth_per_year).]
    owner: Niki
